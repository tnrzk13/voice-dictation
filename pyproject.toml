[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-dictation"
version = "1.0.0"
description = "Real-time voice dictation with streaming transcription using Whisper"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["dictation", "whisper", "speech-to-text", "transcription", "voice"]
authors = [
    {name = "Tony"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.21.0",
    "sounddevice>=0.4.5",
    "faster-whisper>=0.10.0",
    "vosk>=0.3.45"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.1.0"
]

[project.scripts]
dictate = "dictate.cli:main"
dictate-daemon = "dictate.daemon:main"
dictate-live = "dictate.live.cli:main"
dictate-live-daemon = "dictate.live.daemon:main"

[project.urls]
"Homepage" = "https://github.com/tnrzk13/voice-dictation"
"Bug Tracker" = "https://github.com/tnrzk13/voice-dictation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
